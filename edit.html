<!DOCTYPE html>
<html>

<head>

    <title>Edit Student</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>


<body>


<div class="container">


    <h1>✏️ Edit Student</h1>


    <div class="card">


        <form action="/update/{{ student[0] }}" method="POST">


            <input 
                type="text" 
                name="name" 
                value="{{ student[1] }}"
                placeholder="Student Name"
                required
            >


            <input 
                type="text" 
                name="student_id" 
                value="{{ student[2] }}"
                placeholder="Student ID"
                required
            >


            <input 
                type="text" 
                name="course" 
                value="{{ student[3] }}"
                placeholder="Course"
                required
            >


            <button type="submit">
                Update Student
            </button>


        </form>


    </div>


</div>


</body>

</html>
